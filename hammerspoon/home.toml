# The leader tree. Caps Lock opens it, then you spell out what you want:
# noun, then verb, then object.
#
#   CapsLock Space g d   ->  workspace, go, D
#   CapsLock w m l       ->  window, move, right
#   CapsLock c s         ->  claude, status
#
# Two rules make the tree predictable, so you compose a path instead of
# recalling one:
#
#   1. i j k l always mean up, left, down, right. At every level, no exceptions.
#      That is why "join" is g for group and "jump" is n for next. Those four
#      letters are spent. The same rule already applies in .aerospace.toml,
#      which is why no workspace is named H, I, J, K or L.
#
#   2. Each noun owns its own verbs. s is "send" under workspace and "status"
#      under claude. There is no ambiguity, because you name the noun first.
#
# This is the slow, certain route. Frequent actions here also have an alt chord
# in .aerospace.toml. Chords are for speed. The tree is for when you want to be
# sure, or when something else has your attention. Escape backs out of a level.
#
# Hammerflow runs cmd: through /bin/sh, which starts with a bare PATH. So every
# path here is absolute, and listen runs under zsh because it needs the
# SPEECHIFY_API_KEY that .zshenv exports.

leader_key = "f18"
auto_reload = true
show_ui = true
key_maps_per_line = 6

# --------------------------------------------------------------- workspace
[space]
label = "workspace"
space = ["raycast://extensions/limonkufu/aerospace/switchApps", "search windows"]
b = ["cmd:/opt/homebrew/bin/aerospace workspace-back-and-forth", "back and forth"]
f = ["cmd:/opt/homebrew/bin/aerospace flatten-workspace-tree", "flatten tree"]
r = ['input:cmd:$HOME/dotfiles/bin/rename-workspace "$(/opt/homebrew/bin/aerospace list-workspaces --focused)" "{input}"', "rename"]

[space.g]
label = "go to"
1 = ["cmd:/opt/homebrew/bin/aerospace workspace 1", "1"]
2 = ["cmd:/opt/homebrew/bin/aerospace workspace 2", "2"]
3 = ["cmd:/opt/homebrew/bin/aerospace workspace 3", "3"]
