# ------------------------------------------------------------------ window
[w]
label = "window"

[w.f]
label = "focus"
i = ["cmd:/opt/homebrew/bin/aerospace focus up", "up"]
j = ["cmd:/opt/homebrew/bin/aerospace focus left", "left"]
k = ["cmd:/opt/homebrew/bin/aerospace focus down", "down"]
l = ["cmd:/opt/homebrew/bin/aerospace focus right", "right"]

[w.m]
label = "move"
i = ["cmd:/opt/homebrew/bin/aerospace move up", "up"]
j = ["cmd:/opt/homebrew/bin/aerospace move left", "left"]
k = ["cmd:/opt/homebrew/bin/aerospace move down", "down"]
l = ["cmd:/opt/homebrew/bin/aerospace move right", "right"]

[w.g]
label = "group with"
i = ["cmd:/opt/homebrew/bin/aerospace join-with up", "up"]
j = ["cmd:/opt/homebrew/bin/aerospace join-with left", "left"]
k = ["cmd:/opt/homebrew/bin/aerospace join-with down", "down"]
l = ["cmd:/opt/homebrew/bin/aerospace join-with right", "right"]

[w.r]
label = "resize"
b = ["cmd:/opt/homebrew/bin/aerospace resize smart +50", "bigger"]
s = ["cmd:/opt/homebrew/bin/aerospace resize smart -50", "smaller"]

[w.a]
label = "arrange"
t = ["cmd:/opt/homebrew/bin/aerospace layout tiles horizontal vertical", "tiles"]
a = ["cmd:/opt/homebrew/bin/aerospace layout accordion horizontal vertical", "accordion"]
f = ["cmd:/opt/homebrew/bin/aerospace layout floating tiling", "floating"]

# ------------------------------------------------------------------ claude
[c]
label = "claude"
s = ["cmd:$HOME/dotfiles/claude/fleet-status.sh list", "fleet status"]
n = ["cmd:$HOME/dotfiles/claude/fleet-status.sh jump", "next waiting"]
p = ['cmd:/bin/zsh -c "$HOME/dotfiles/bin/listen -b"', "play last turn"]
e = ['cmd:/bin/zsh -c "$HOME/dotfiles/bin/listen -a -b"', "play whole session"]
x = ['cmd:/bin/zsh -c "$HOME/dotfiles/bin/listen -s"', "stop playing"]

# ------------------------------------------------------------------ system
[s]
label = "system"
a = ["cmd:/opt/homebrew/bin/aerospace reload-config", "reload aerospace"]
h = ["reload", "reload hammerspoon"]
