# Claude's idle notification has no exact Codex event. Stop is the closest
# lifecycle point, while PermissionRequest preserves the waiting-for-approval
# state.
[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "bash /Users/andrew/dotfiles/claude/fleet-waiting.sh permission"
timeout = 5

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "bash /Users/andrew/dotfiles/claude/fleet-mark.sh working"
timeout = 5

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "bash /Users/andrew/dotfiles/claude/fleet-waiting.sh idle"
timeout = 5

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = "bash /Users/andrew/dotfiles/claude/fleet-clear.sh"
timeout = 5

[projects."/Users/andrew/dotfiles"]
trust_level = "trusted"

[projects."/Users/andrew/Dropbox/andrew/skylight/code/dtak-prototype"]
