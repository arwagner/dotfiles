# Codex CLI settings, linked to ~/.codex/config.toml by bin/install.
#
# Only this file is tracked. The rest of ~/.codex is runtime state that must
# not reach a public repo: auth.json holds live ChatGPT OAuth credentials,
# alongside log/, tmp/, sessions and history. That is the same reason ~/.claude
# is linked file by file rather than as a directory.
#
# Shared behavior migrated from claude/settings.json and claude/CLAUDE.md.
# Keep workspace write access, but do not disable Codex's sandbox entirely.
approval_policy = "never"
sandbox_mode = "workspace-write"
check_for_update_on_startup = false
analytics.enabled = false
feedback.enabled = false
project_doc_fallback_filenames = ["CLAUDE.md"]
developer_instructions = """
- When input or a decision is needed, ask in plain text; do not use a structured question picker.
- Never credit Codex, OpenAI, or any AI as an author or co-author. Do not add AI co-author trailers, generated-by footers, or equivalent attribution to commits, pull requests, issues, or comments.
- Keep reports extremely concise; sacrifice grammar for concision.
"""

[tui]
# Closest equivalents to Claude's fullscreen TUI, disabled spinner tips, and
# agent push notifications. Codex has no command-backed status line.
alternate_screen = "always"
animations = false
notifications = true

[features]
hooks = true

[mcp_servers.todo]
command = "ssh"
args = [
  "-o",
  "BatchMode=yes",
  "root@187.124.159.132",
  "runuser -u todo -- env TODO_DB=/var/lib/todo/todo.db TODO_TOKEN=${TODO_API_KEY} /opt/node24/bin/node --disable-warning=ExperimentalWarning /opt/todo/current/src/adapters/mcp/main.ts",
]
default_tools_approval_mode = "auto"

# Claude commands become globally available Codex skills.
[[skills.config]]
